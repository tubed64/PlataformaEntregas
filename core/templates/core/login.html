<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogiTrack – Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#0d1117; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:2rem; width:100%; max-width:400px; }
  .form-control { background:#21262d; border-color:#30363d; color:#e6edf3; }
  .form-control:focus { background:#21262d; border-color:#f59e0b; color:#e6edf3; box-shadow:none; }
  .brand { font-size:1.6rem; font-weight:800; color:#f59e0b; }
  .btn-login { background:#f59e0b; border:none; color:#000; font-weight:700; width:100%; padding:.7rem; }
  .btn-login:hover { background:#d97706; }
  label { color:#8b949e; font-size:.85rem; }
</style>
</head>
<body>
<div class="card">
  <div class="brand mb-1">Entregas_Diego</div>

  {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-danger py-2">{{ msg }}</div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label>Usuario</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-4">
      <label>Contraseña</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-login">Iniciar sesión</button>
  </form>
</div>
</body>
</html>
