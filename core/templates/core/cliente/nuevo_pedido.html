<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuevo Pedido</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;}
.navbar{background:#161b22;border-bottom:1px solid #30363d;padding:.9rem 2rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;}
.navbar .brand{font-size:1.2rem;font-weight:800;color:#f59e0b;}
.btn-back{background:transparent;border:1px solid #30363d;color:#8b949e;
  padding:.3rem .9rem;border-radius:6px;text-decoration:none;font-size:.82rem;transition:all .2s;}
.btn-back:hover{border-color:#f59e0b;color:#f59e0b;}
.main{max-width:900px;margin:0 auto;padding:2rem 1.5rem;}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;margin-bottom:1.5rem;}
.card-header{padding:1rem 1.5rem;border-bottom:1px solid #30363d;font-weight:700;font-size:.95rem;}
.card-body{padding:1.5rem;}
.form-label{font-size:.8rem;color:#8b949e;margin-bottom:.3rem;display:block;}
.form-control,.form-select{
  background:#21262d;border:1px solid #30363d;color:#e6edf3;
  padding:.55rem .9rem;border-radius:6px;width:100%;font-size:.88rem;
  transition:border-color .2s;
}
.form-control:focus,.form-select:focus{
  outline:none;border-color:#f59e0b;background:#21262d;color:#e6edf3;}
.form-group{margin-bottom:1rem;}

.producto-row{
  display:grid;
  grid-template-columns:2fr 80px 120px auto;
  gap:.75rem;align-items:end;margin-bottom:.75rem;
}
.btn-remove{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
  color:#ef4444;border-radius:6px;padding:.5rem .75rem;
  cursor:pointer;font-size:.9rem;transition:background .2s;
}
.btn-remove:hover{background:rgba(239,68,68,.25);}
.btn-add{
  background:transparent;border:1px solid #30363d;color:#8b949e;
  padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;
  font-size:.85rem;transition:all .2s;
}
.btn-add:hover{border-color:#f59e0b;color:#f59e0b;}

.resumen{
  background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:1.25rem;
}
.resumen-row{
  display:flex;justify-content:space-between;
  padding:.5rem 0;border-bottom:1px solid #21262d;font-size:.88rem;
}
.resumen-row:last-child{border-bottom:none;}
.resumen-total{font-size:1.2rem;font-weight:800;color:#f59e0b;}

.btn-submit{
  background:#f59e0b;border:none;color:#000;font-weight:700;
  padding:.75rem 2rem;border-radius:8px;font-size:1rem;
  cursor:pointer;transition:background .2s;width:100%;margin-top:1rem;
}
.btn-submit:hover{background:#d97706;}

.alert-error{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
  color:#ef4444;padding:.75rem 1rem;border-radius:6px;
  margin-bottom:1rem;font-size:.85rem;
}

@media(max-width:600px){
  .producto-row{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">Entregas_Diego</div>
  <a href="{% url 'cliente_dashboard' %}" class="btn-back">← Mis pedidos</a>
</nav>

<div class="main">
  <h4 style="margin-bottom:1.5rem;font-weight:700">📦 Nuevo Pedido</h4>

  {% if messages %}
    {% for msg in messages %}
    <div class="alert-error">{{ msg }}</div>
    {% endfor %}
  {% endif %}

  <form method="post" id="pedido-form">
    {% csrf_token %}
    <div class="row g-4">

      <!-- Columna izquierda -->
      <div class="col-lg-8">

        <!-- Dirección -->
        <div class="card">
          <div class="card-header" style="color: white;">📍 Dirección de Entrega</div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label ">Dirección completa *</label>
              <input type="text" name="direccion_entrega" class="form-control"
                     placeholder="Calle, número, colonia, ciudad"
                     value="{{ cliente.direccion }}" required>
            </div>
          </div>
        </div>

        <!-- Productos -->
        <div class="card">
          <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
            <span style="color: white;">🛍 Productos</span>
            <button type="button" class="btn-add" onclick="agregarProducto()">+ Agregar</button>
          </div>
          <div class="card-body">
            <div style="display:grid;grid-template-columns:2fr 80px 120px auto;
                        gap:.75rem;margin-bottom:.5rem;">
              <span style="font-size:.75rem;color:#8b949e">Producto</span>
              <span style="font-size:.75rem;color:#8b949e">Cantidad</span>
              <span style="font-size:.75rem;color:#8b949e">Precio unit.</span>
              <span></span>
            </div>
            <div id="productos-container">
              <div class="producto-row" id="row-1">
                <input type="text" name="producto[]" class="form-control"
                       placeholder="Nombre del producto" required>
                <input type="number" name="cantidad[]" class="form-control cant"
                       placeholder="1" min="1" value="1" required>
                <input type="number" name="precio_unitario[]" class="form-control precio"
                       placeholder="0.00" min="0" step="0.01" required>
                <button type="button" class="btn-remove" onclick="quitarProducto('row-1')">✕</button>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Resumen -->
      <div class="col-lg-4">
        <div class="card" style="position:sticky;top:80px">
          <div class="card-header" style="color: white;">🧾 Resumen</div>
          <div class="card-body">
            <div class="resumen">
              <div class="resumen-row">
                <span style="color:#8b949e">Cliente</span>
                <span style="color: white;">{{ cliente.nombre_completo }}</span>
              </div>
              <div class="resumen-row">
                <span style="color:#8b949e">Subtotal</span>
                <span id="resumen-subtotal" style="color: white;" >$0.00</span>
              </div>
              <div class="resumen-row">
                <span style="font-weight:700;color: white;">TOTAL</span>
                <span class="resumen-total" id="resumen-total" style="color: white;">$0.00</span>
              </div>
            </div>
            <button type="submit" class="btn-submit">
              ✅ Confirmar Pedido
            </button>
            <a href="{% url 'cliente_dashboard' %}"
               style="display:block;text-align:center;margin-top:.75rem;
                      color:#8b949e;font-size:.85rem;text-decoration:none;">
              Cancelar
            </a>
          </div>
        </div>
      </div>

    </div>
  </form>
</div>

<script>
let contador = 1;

function fmt(n) {
  return '$' + Number(n).toLocaleString('es-MX', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}

function recalcular() {
  let total = 0;
  document.querySelectorAll('.producto-row').forEach(row => {
    const cant   = parseFloat(row.querySelector('.cant').value)  || 0;
    const precio = parseFloat(row.querySelector('.precio').value) || 0;
    total += cant * precio;
  });
  document.getElementById('resumen-subtotal').textContent = fmt(total);
  document.getElementById('resumen-total').textContent    = fmt(total);
}

function agregarProducto() {
  contador++;
  const id  = 'row-' + contador;
  const div = document.createElement('div');
  div.className = 'producto-row';
  div.id = id;
  div.innerHTML = `
    <input type="text" name="producto[]" class="form-control"
           placeholder="Nombre del producto" required>
    <input type="number" name="cantidad[]" class="form-control cant"
           placeholder="1" min="1" value="1" required>
    <input type="number" name="precio_unitario[]" class="form-control precio"
           placeholder="0.00" min="0" step="0.01" required>
    <button type="button" class="btn-remove" onclick="quitarProducto('${id}')">✕</button>
  `;
  document.getElementById('productos-container').appendChild(div);
  div.querySelectorAll('input').forEach(i => i.addEventListener('input', recalcular));
}

function quitarProducto(id) {
  const rows = document.querySelectorAll('.producto-row');
  if (rows.length <= 1) return;
  document.getElementById(id).remove();
  recalcular();
}

// Escuchar cambios en inputs existentes
document.addEventListener('input', e => {
  if (e.target.classList.contains('cant') || e.target.classList.contains('precio')) {
    recalcular();
  }
});
</script>

</body>
</html>
